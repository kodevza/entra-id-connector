name: Build connector
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Test OpenIDM configuration and installers
        run: python3 -m unittest discover -s openidm/tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openidm/workflow-form/package-lock.json
      - name: Build and integration-test the ownership UI
        working-directory: openidm/workflow-form
        run: |
          npm ci
          npm test
      - name: Pull offline integration test images
        run: |
          docker pull openidentityplatform/openidm:latest
          docker pull python:3.12-alpine
      - name: Test reconciliation against mock Entra
        run: python3 openidm/tests/offline_reconciliation.py
      - uses: actions/upload-artifact@v4
        with:
          name: entra-id-connector
          path: target/entra-id-connector-*.jar
          if-no-files-found: error
